# FIT File Sync Pipeline Configuration
# Copy this file to config.yaml and fill in your settings.

intervals:
  # Get your API key from https://intervals.icu/settings
  api_key: "YOUR_INTERVALS_API_KEY"

sync:
  interval_minutes: 60       # How often to check for new activities
  lookback_days: 7           # How many days back to check on each sync
  delay_between_files_ms: 100  # Delay between API calls (rate limiting)
  dry_run: false             # Set to true to test without uploading
  # sources:                 # Only sync from specific devices/platforms (optional)
  #   - WAHOO                # Wahoo (ELEMNT, RIVAL, etc.)
  #   - HAMMERHEAD           # Hammerhead Karoo
  #   - COROS                # Coros watches
  #   - POLAR                # Polar devices
  #   - SUUNTO              # Suunto devices

fit_file_faker:
  # Garmin Connect credentials (used by fit-file-faker for uploads)
  garmin_username: "your_garmin_email@example.com"
  garmin_password: "your_garmin_password"

  # Device to emulate in Garmin Connect
  # Use numeric IDs from Garmin's FIT SDK.
  # Common devices:
  #   Edge 1030: device 3121    Edge 1040: device 3122
  #   Edge 840:  device 4061    Edge 530:  device 3121
  #   Forerunner 965: device 4312   Fenix 7: device 3906
  # manufacturer 1 = Garmin (always use 1)
  # serial_number should be your real Garmin device's Unit ID for full
  # Garmin Connect integration (Training Status, badges, etc.)
  # Find it: Device → Settings → About → Unit ID
  device:
    manufacturer: 1
    device: 3121
    serial_number: 3982691993
    # software_version: null  # Optional, e.g. 2922 = v29.22
